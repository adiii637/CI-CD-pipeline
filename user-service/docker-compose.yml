services:
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  user-service:
    build:
      context: .
    container_name: user-service
    ports:
      - "5051:5050"
    environment:
      PORT: 5050
      MONGO_URI: mongodb://mongo:27017/user-service
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data: